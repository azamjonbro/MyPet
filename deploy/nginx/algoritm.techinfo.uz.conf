# nginx server block for the AI English Pet API.
#
#   sudo cp deploy/nginx/algoritm.techinfo.uz.conf \
#           /etc/nginx/sites-available/algoritm.techinfo.uz
#   sudo nginx -t && sudo systemctl reload nginx
#
# The site and its certificate already existed; this replaces the body with
# settings the tutor's SSE stream survives. The certbot lines are kept exactly
# as certbot wrote them so renewals keep working.

server {
    server_name algoritm.techinfo.uz;

    client_max_body_size 1M;

    access_log /var/log/nginx/pet-api.access.log;
    error_log  /var/log/nginx/pet-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:7779;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Empty, not "upgrade". There are no websockets here, and an
        # unconditional Connection: upgrade confuses keepalive on a plain
        # request.
        proxy_set_header Connection        "";

        # The tutor streams its reply over SSE. With buffering on, nginx holds
        # the whole answer and the pet looks frozen until it finishes — the app
        # is fine, the proxy is what breaks it. gzip is off for the same
        # reason: compression re-buffers the stream.
        proxy_buffering off;
        proxy_cache     off;
        gzip            off;

        # A chat stream idles between tokens. The old 60s cut it mid-reply.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/algoritm.techinfo.uz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/algoritm.techinfo.uz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = algoritm.techinfo.uz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name algoritm.techinfo.uz;
    return 404; # managed by Certbot
}
