# nginx server block for the AI English Pet API.
#
#   sudo cp deploy/nginx/algoritm.techinfo.uz.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/algoritm.techinfo.uz.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The certificate must exist before this file is enabled, or nginx will not
# start. DEPLOY.md has the bootstrap order.

upstream pet_api {
    # The API container publishes on loopback only (docker-compose.prod.yml).
    server 127.0.0.1:4100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name algoritm.techinfo.uz;

    # Certbot renewals keep working over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name algoritm.techinfo.uz;

    ssl_certificate     /etc/letsencrypt/live/algoritm.techinfo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/algoritm.techinfo.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # The API rejects anything larger itself (express.json caps at 128kb);
    # this just stops a big body from being read all the way in first.
    client_max_body_size 256k;

    access_log /var/log/nginx/pet-api.access.log;
    error_log  /var/log/nginx/pet-api.error.log;

    location / {
        proxy_pass http://pet_api;

        proxy_http_version 1.1;
        # Empty Connection header, not "close" — required for keepalive to the
        # upstream, and required for SSE to stay open.
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The tutor streams its reply over SSE. With buffering on, nginx holds
        # the whole answer and the pet looks frozen until it finishes — the app
        # is fine, the proxy is what breaks it. Same reason gzip is off here:
        # compression re-buffers the stream.
        proxy_buffering    off;
        proxy_cache        off;
        gzip               off;

        # A chat stream can idle between tokens; the default 60s would cut it.
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;
    }
}
